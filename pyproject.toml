[project]
name = "chesscom-ai-coach"
version = "1.0.0"
description = "An engine-grounded AI chess coach for Chess.com players"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chess>=1.10",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
