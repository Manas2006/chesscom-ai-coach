# One-click deploy: https://render.com/deploy?repo=https://github.com/Manas2006/chesscom-ai-coach
# The offline demo is pre-analysed at build time, so it is instant even on the free plan.
# Live analysis of new usernames runs Stockfish on the instance; a paid plan with more CPU is much faster.
services:
  - type: web
    name: chesscom-ai-coach
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # entered in the Render dashboard, never committed
      - key: LLM_RATE_LIMIT_PER_HOUR
        value: "20" # per visitor IP, protects the API budget on a public link
      - key: ENGINE_WORKERS
        value: "1"
